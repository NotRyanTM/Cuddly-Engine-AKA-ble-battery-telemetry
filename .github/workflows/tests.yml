name: tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Run pytest
        working-directory: bridge  # the tests import protocol.py from this folder
        run: python -m pytest -v

  android:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"  # matches gradle/gradle-daemon-jvm.properties
      - uses: gradle/actions/setup-gradle@v4  # caches Gradle downloads between runs
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
